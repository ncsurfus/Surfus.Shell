name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build --verbosity normal

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Run benchmarks
        run: dotnet run --project Surfus.Shell.Benchmarks -c Release -- --filter "*Throughput*" --job short --exporters json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: Surfus.Shell.Benchmarks/BenchmarkDotNet.Artifacts/
